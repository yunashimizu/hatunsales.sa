<nav class="sidebar" [class.collapsed]="collapsed" aria-label="Menú principal">

  <a class="sb-brand" routerLink="/dashboard/home" title="Ir al inicio del panel">
    <span class="sb-logo" aria-hidden="true"><i class="bi bi-tools"></i></span>
    <span class="brand-text">
      <span class="brand-name">HatunSales</span>
      <span class="brand-suffix">S.A.C · Panel</span>
    </span>
  </a>

  <div class="sb-menu-wrap">

    <div class="sb-section" *ngFor="let seccion of secciones" [hidden]="!seccionVisible(seccion)">
      <button
        type="button"
        class="sb-section-label sb-section-toggle"
        [class.open]="estaAbierta(seccion.titulo)"
        (click)="toggleSeccion(seccion.titulo)"
        [attr.aria-expanded]="estaAbierta(seccion.titulo)"
      >
        <span>{{ seccion.titulo }}</span>
        <i class="bi bi-chevron-down" aria-hidden="true"></i>
      </button>

      <div class="sb-section-body" [class.open]="estaAbierta(seccion.titulo)">
        <div class="sb-section-inner">
          <ul class="sb-menu">
            <li *ngFor="let item of seccion.items" routerLinkActive="active" [hidden]="!visible(item)">
              <a [routerLink]="item.ruta" [attr.title]="collapsed ? item.etiqueta : null">
                <i class="bi sb-nav-icon" [ngClass]="item.icono" aria-hidden="true"></i>
                <span class="sb-nav-text">{{ item.etiqueta }}</span>
                <span class="sb-badge"
                      *ngIf="badgeDe(item) > 0"
                      [class.sb-badge--peligro]="tonoBadge(item) === 'peligro'"
                      [class.sb-badge--aviso]="tonoBadge(item) === 'aviso'"
                      [attr.title]="tituloBadge(item)">
                  {{ badgeDe(item) > 99 ? '99+' : badgeDe(item) }}
                </span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="sb-section sb-section--cuenta">
      <div class="sb-section-label" *ngIf="cuenta.some(i => visible(i))">Cuenta</div>
      <ul class="sb-menu">
        <li *ngFor="let item of cuenta" routerLinkActive="active" [hidden]="!visible(item)">
          <a [routerLink]="item.ruta" [attr.title]="collapsed ? item.etiqueta : null">
            <i class="bi sb-nav-icon" [ngClass]="item.icono" aria-hidden="true"></i>
            <span class="sb-nav-text">{{ item.etiqueta }}</span>
          </a>
        </li>
        <li>
          <a routerLink="/store" title="Ver la tienda online sin cerrar sesión">
            <i class="bi sb-nav-icon bi-shop" aria-hidden="true"></i>
            <span class="sb-nav-text">Ir a la tienda</span>
            <i class="bi bi-box-arrow-up-right sb-nav-ext" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
    </div>

  </div>

  <div class="sb-footer">
    <div class="sb-footer-info" [attr.title]="(sesion.nombre || 'Usuario') + ' · ' + etiquetaRol">
      <span class="sb-avatar" aria-hidden="true">{{ sesion.iniciales }}</span>
      <div class="sb-footer-text">
        <strong>{{ sesion.nombre || 'Usuario' }}</strong>
        <small><span class="sb-footer-punto" aria-hidden="true"></span>{{ etiquetaRol }}</small>
      </div>
    </div>
  </div>

</nav>
