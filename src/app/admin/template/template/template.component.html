<div id="wrapper" [class.sb-collapsed]="sidebarCollapsed">

  <a class="adm-saltar" href="#contenido" (click)="saltarAlContenido($event)">Saltar al contenido</a>
  <app-barra-progreso></app-barra-progreso>

  <button
    *ngIf="!sidebarCollapsed"
    type="button"
    class="sb-backdrop"
    aria-label="Cerrar menú"
    (click)="toggleSidebar()">
  </button>

  <app-sidebar [collapsed]="sidebarCollapsed"></app-sidebar>
  <app-paleta-comandos></app-paleta-comandos>
  <app-ayuda-atajos></app-ayuda-atajos>

  <div id="main-wrapper">
    <app-header
      [sidebarAbierto]="!sidebarCollapsed"
      (onToggleSidebar)="toggleSidebar()">
    </app-header>

    <div #contenidoPanel id="contenido" class="main-content" tabindex="-1">
      <router-outlet></router-outlet>
    </div>

    <app-footer></app-footer>
  </div>

  <app-barra-inferior (menu)="toggleSidebar()"></app-barra-inferior>
</div>
