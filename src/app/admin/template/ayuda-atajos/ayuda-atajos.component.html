@if (ayuda.abierta()) {
  <div class="adm-velo" (click)="cerrar()" aria-hidden="true"></div>
  <div class="adm-modal">
    <div
      class="adm-modal__marco aya-marco"
      role="dialog"
      aria-modal="true"
      aria-labelledby="aya-titulo"
      tabindex="-1"
      (keydown.escape)="cerrar()"
      (keydown.tab)="alTabular($any($event))">
      <div class="adm-modal__cabecera">
        <div class="adm-tarjeta__encabezado">
          <h2 class="adm-tarjeta__titulo" id="aya-titulo"><i class="bi bi-keyboard" aria-hidden="true"></i> Atajos de teclado</h2>
          <p class="adm-tarjeta__sub">Trabaje sin soltar el teclado.</p>
        </div>
        <button #cerrarBtn type="button" class="adm-btn-icono" (click)="cerrar()" aria-label="Cerrar la ayuda de atajos" title="Cerrar">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>

      <div class="adm-modal__cuerpo aya-cuerpo">
        @for (grupo of grupos; track grupo.titulo) {
          <section class="aya-grupo" [attr.aria-label]="grupo.titulo">
            <h3 class="aya-grupo__titulo">{{ grupo.titulo }}</h3>
            <table class="aya-tabla">
              <tbody>
                @for (atajo of grupo.atajos; track atajo.texto) {
                  <tr>
                    <th scope="row" class="aya-teclas">
                      @for (tecla of atajo.teclas; track $index) {
                        <kbd class="adm-kbd">{{ tecla }}</kbd>
                      }
                    </th>
                    <td>{{ atajo.texto }}</td>
                  </tr>
                }
              </tbody>
            </table>
          </section>
        }
      </div>

      <div class="adm-modal__pie">
        <button #pieBtn type="button" class="adm-btn adm-btn--suave" (click)="cerrar()">Entendido</button>
      </div>
    </div>
  </div>
}
