<nav class="topbar">

  <button class="toggle-btn"
          type="button"
          aria-label="Abrir o cerrar menú"
          [attr.aria-expanded]="sidebarAbierto"
          [class.open]="sidebarAbierto"
          (click)="onToggleSidebar.emit()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="tb-title" *ngIf="paginaActual">
    <span class="tb-title__icon" aria-hidden="true"><i class="bi" [ngClass]="iconoActual"></i></span>
    <div class="tb-title__textos">
      <span class="tb-title__group" *ngIf="grupoActual">{{ grupoActual }}</span>
      <span class="tb-title__text">{{ paginaActual }}</span>
    </div>
  </div>

  <div class="tb-actions">
    <span class="tb-fecha" [attr.title]="fechaLarga">
      <i class="bi bi-calendar3" aria-hidden="true"></i>
      <span>{{ fechaCorta }}</span>
    </span>

    <a class="tb-link-tienda"
       routerLink="/store"
       title="Ver la tienda online (sin cerrar sesión)">
      <i class="bi bi-shop" aria-hidden="true"></i>
      <span>Ver tienda</span>
    </a>

    <div class="user-pill"
         role="button"
         tabindex="0"
         [attr.aria-expanded]="showUser"
         [class.open]="showUser"
         (click)="toggleUser()"
         (keydown.enter)="alTeclaUsuario($event)"
         (keydown.space)="alTeclaUsuario($event)">
      <div class="user-avatar" aria-hidden="true">{{ sesion.iniciales }}</div>
      <div class="user-info">
        <span class="user-name">{{ sesion.nombre || 'Usuario' }}</span>
        <span class="user-role">{{ etiquetaRol }}</span>
      </div>
      <i class="bi bi-chevron-down tb-chevron" [class.rotated]="showUser" aria-hidden="true"></i>

      <div class="user-dropdown" [class.show]="showUser" (click)="$event.stopPropagation()">
        <div class="ud-meta">
          <div class="ud-avatar" aria-hidden="true">{{ sesion.iniciales }}</div>
          <div class="ud-meta__textos">
            <strong>{{ sesion.nombre || 'Usuario' }}</strong>
            <small *ngIf="sesion.email">{{ sesion.email }}</small>
            <span class="ud-rol">{{ etiquetaRol }}</span>
          </div>
        </div>
        <a class="ud-item" routerLink="/dashboard/perfil">
          <i class="bi bi-person" aria-hidden="true"></i> Mi perfil
        </a>
        <a class="ud-item" routerLink="/dashboard/configuracion">
          <i class="bi bi-gear" aria-hidden="true"></i> Configuración
        </a>
        <a class="ud-item" routerLink="/store">
          <i class="bi bi-shop" aria-hidden="true"></i> Ir a la tienda
        </a>
        <div class="ud-divider"></div>
        <a class="ud-item ud-logout" (click)="logout()">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Cerrar sesión
        </a>
      </div>
    </div>
  </div>
</nav>
