<app-auth-shell modo="login">
  <div #cardInner>

    <div class="mb-6">
      <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-[1.7rem]">
        Bienvenido nuevamente 👋
      </h1>
      <p class="mt-1.5 text-sm text-slate-500">
        Inicia sesión para continuar comprando en Hatunsales S.A.C.
      </p>
    </div>

    <div
      *ngIf="errorMsg"
      class="mb-4 flex items-start gap-2 rounded-2xl border border-rose-200 bg-rose-50 px-3.5 py-3 text-sm text-rose-700"
      role="alert"
    >
      <i class="bi bi-exclamation-circle mt-0.5"></i>
      <span>{{ errorMsg }}</span>
    </div>

    <form [formGroup]="loginForm" class="space-y-4" (ngSubmit)="login()" autocomplete="on">

      <div>
        <label class="mb-1.5 block text-xs font-semibold text-slate-700" for="login-email">Correo electrónico</label>
        <div class="relative">
          <i class="bi bi-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="login-email"
            type="email"
            formControlName="email"
            placeholder="tu@correo.com"
            class="w-full rounded-2xl border border-slate-200 bg-slate-50/80 py-3 pl-10 pr-3 text-sm text-slate-900 outline-none transition focus:border-violet-400 focus:bg-white focus:ring-4 focus:ring-violet-100"
          />
        </div>
      </div>

      <div>
        <label class="mb-1.5 block text-xs font-semibold text-slate-700" for="login-password">Contraseña</label>
        <div class="relative">
          <i class="bi bi-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="login-password"
            [type]="mostrarPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="w-full rounded-2xl border border-slate-200 bg-slate-50/80 py-3 pl-10 pr-11 text-sm text-slate-900 outline-none transition focus:border-violet-400 focus:bg-white focus:ring-4 focus:ring-violet-100"
          />
          <button
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700"
            (click)="mostrarPassword = !mostrarPassword"
            [attr.aria-label]="mostrarPassword ? 'Ocultar' : 'Mostrar'"
          >
            <i class="bi" [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between gap-3 text-sm">
        <label class="inline-flex cursor-pointer items-center gap-2 text-slate-600">
          <input type="checkbox" class="rounded border-slate-300 text-violet-600 focus:ring-violet-500" [(ngModel)]="recordarme" [ngModelOptions]="{standalone: true}" />
          Recordarme
        </label>
        <button
          type="button"
          class="cursor-not-allowed text-slate-400 line-through decoration-slate-300"
          disabled
          title="Próximamente"
        >
          ¿Olvidaste tu contraseña?
        </button>
      </div>

      <button
        type="submit"
        class="group inline-flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-3.5 text-sm font-semibold text-white shadow-lg shadow-violet-500/30 transition-all hover:scale-[1.02] hover:shadow-xl disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:scale-100"
        [disabled]="cargando || googleCargando"
      >
        <span *ngIf="!cargando">Iniciar sesión <i class="bi bi-arrow-right transition group-hover:translate-x-0.5"></i></span>
        <span *ngIf="cargando" class="inline-flex items-center gap-2">
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
          Verificando…
        </span>
      </button>
    </form>

    <div class="my-5 flex items-center gap-3 text-xs text-slate-400">
      <span class="h-px flex-1 bg-slate-200"></span>
      o continúa con
      <span class="h-px flex-1 bg-slate-200"></span>
    </div>

    <app-google-sign-in
      etiqueta="Continuar con Google"
      [cargando]="googleCargando || cargando"
      (credential)="onGoogle($event)"
      (fallo)="onGoogleError($event)"
    ></app-google-sign-in>

    <p class="mt-6 text-center text-sm text-slate-500">
      ¿No tienes una cuenta?
      <a routerLink="/auth/registro" class="font-semibold text-violet-600 hover:text-violet-700">Crear cuenta</a>
    </p>
  </div>
</app-auth-shell>
