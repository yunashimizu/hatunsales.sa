<app-auth-shell modo="login">
  <div #cardInner>

    <div class="auth-form-cab">
      <h1 class="auth-form-titulo">Bienvenido nuevamente</h1>
      <p class="auth-form-sub">Inicia sesión con tu cuenta de Hatunsales S.A.C.</p>
    </div>

    <div *ngIf="avisoMsg" class="auth-aviso auth-aviso--info" role="status">
      <i class="bi bi-clock-history"></i>
      <span>{{ avisoMsg }}</span>
    </div>

    <div *ngIf="errorMsg" class="auth-aviso auth-aviso--error" role="alert">
      <i class="bi bi-exclamation-circle"></i>
      <span>{{ errorMsg }}</span>
    </div>

    <form [formGroup]="loginForm" class="space-y-4" (ngSubmit)="login()" autocomplete="on">

      <div>
        <label class="auth-label" for="login-email">Correo electrónico</label>
        <div class="auth-input-wrap">
          <i class="bi bi-envelope auth-input-ico"></i>
          <input
            id="login-email"
            type="email"
            formControlName="email"
            placeholder="tu@correo.com"
            class="auth-input"
          />
        </div>
      </div>

      <div>
        <label class="auth-label" for="login-password">Contraseña</label>
        <div class="auth-input-wrap">
          <i class="bi bi-lock auth-input-ico"></i>
          <input
            id="login-password"
            [type]="mostrarPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="auth-input auth-input--ojo"
          />
          <button
            type="button"
            class="auth-ojo"
            (click)="mostrarPassword = !mostrarPassword"
            [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="mostrarPassword"
          >
            <i class="bi" [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between gap-3">
        <label class="auth-check">
          <input type="checkbox" [(ngModel)]="recordarme" [ngModelOptions]="{standalone: true}" />
          Recordarme
        </label>
        <!-- "¿Olvidaste tu contraseña?" vuelve cuando exista el flujo de recuperación. -->
      </div>

      <button
        type="submit"
        class="x-boton x-boton--lg x-boton--bloque"
        [disabled]="cargando || googleCargando"
      >
        <span *ngIf="!cargando">Iniciar sesión <i class="bi bi-arrow-right"></i></span>
        <span *ngIf="cargando" class="inline-flex items-center gap-2">
          <span class="auth-spinner"></span>
          Verificando…
        </span>
      </button>
    </form>

    <div class="auth-divisor">o continúa con</div>

    <app-google-sign-in
      etiqueta="Continuar con Google"
      [cargando]="googleCargando || cargando"
      (credential)="onGoogle($event)"
      (fallo)="onGoogleError($event)"
    ></app-google-sign-in>

    <p class="auth-cambio">
      ¿No tienes una cuenta?
      <a routerLink="/auth/registro" class="auth-enlace">Crear cuenta</a>
    </p>
  </div>
</app-auth-shell>
