<article class="tarjeta x-brillo" [class.agotado]="producto.stock <= 0" hsSpotlight>

  <div class="imagen">
    <a class="marco" [routerLink]="['/store/producto', producto.id_producto]" [attr.aria-label]="producto.nombre" (click)="alIrADetalle()">
      <img *ngIf="!sinImagen; else sinFoto" [src]="imagen" [alt]="producto.nombre" loading="lazy" (error)="imagenAlternativa($event)" />

      <ng-template #sinFoto>
        <span class="sin-imagen" role="img" aria-label="Producto sin imagen">
          <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
            <path d="M60 8 L105 34 V86 L60 112 L15 86 V34 Z" />
            <circle cx="60" cy="60" r="26" />
            <circle cx="60" cy="60" r="17" stroke-dasharray="2 5" />
          </svg>
          <span class="x-etiqueta">Sin imagen</span>
        </span>
      </ng-template>
    </a>

    <div class="insignias">
      <span class="insignia oferta" *ngIf="producto.descuento > 0">{{ porcentaje > 0 ? '−' + porcentaje + '%' : 'Oferta' }}</span>
      <span class="insignia nuevo" *ngIf="producto.destacado && producto.descuento <= 0">Destacado</span>
    </div>

    <button
      type="button"
      class="favorito"
      [class.activo]="esFavorito"
      (click)="onFavorito($event)"
      [attr.aria-label]="esFavorito ? 'Quitar de favoritos' : 'Guardar en favoritos'"
      [attr.aria-pressed]="esFavorito">
      <i class="bi" [class.bi-heart-fill]="esFavorito" [class.bi-heart]="!esFavorito"></i>
    </button>
  </div>

  <div class="cuerpo">
    <div class="meta">
      <span class="marca" *ngIf="producto.marca">{{ producto.marca }}</span>
      <app-estrellas
        class="rating"
        [valor]="producto.rating"
        [total]="producto.total_resenas"
        *ngIf="producto.total_resenas > 0">
      </app-estrellas>
    </div>

    <a class="nombre" [routerLink]="['/store/producto', producto.id_producto]" (click)="alIrADetalle()">{{ producto.nombre }}</a>

    <div class="precios">
      <span class="precio"><small>S/</small>{{ producto.precio_final | number: '1.2-2' }}</span>
      <span class="precio-antes" *ngIf="ahorro > 0">S/ {{ producto.precio | number: '1.2-2' }}</span>
    </div>

    <span class="ahorro" *ngIf="ahorro > 0">Ahorras S/ {{ ahorro | number: '1.2-2' }}</span>

    <div class="pie">
      <span class="stock" [class]="etiquetaStock.clase">
        <i class="bi bi-circle-fill"></i>{{ etiquetaStock.texto }}
      </span>

      <button
        type="button"
        class="agregar"
        (click)="onAgregar($event)"
        [disabled]="producto.stock <= 0 || cargando">
        <i class="bi" [class.bi-bag-plus]="!cargando" [class.bi-arrow-repeat]="cargando" [class.girando]="cargando"></i>
        <span>{{ producto.stock > 0 ? 'Agregar' : 'Agotado' }}</span>
      </button>
    </div>
  </div>
</article>
