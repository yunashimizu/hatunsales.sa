<div class="velo" [class.abierto]="abiertoEnMovil" (click)="cerrarEnMovil.emit()" aria-hidden="true"></div>

<aside class="filtros" id="panel-filtros" [class.abierto]="abiertoEnMovil" aria-label="Filtros de búsqueda">

  <header class="cabecera">
    <h2><span class="cabecera__icono" aria-hidden="true"><i class="bi bi-sliders"></i></span>Filtros</h2>

    <div class="acciones">
      <button type="button" class="limpiar" *ngIf="totalActivos > 0" (click)="limpiar.emit()">
        Limpiar ({{ totalActivos }})
      </button>
      <button type="button" class="cerrar-movil" #cerrar (click)="cerrarEnMovil.emit()" aria-label="Cerrar filtros">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </header>

  <div class="cuerpo">

    <!-- Categorías -->
    <section class="bloque" *ngIf="disponibles.categorias.length > 0">
      <button type="button" class="titulo-bloque" (click)="alternar('categorias')" [attr.aria-expanded]="!estaColapsada('categorias')">
        <span class="titulo-bloque__texto"><span class="n x-numero" aria-hidden="true"></span>Categorías</span>
        <i class="bi bi-chevron-down" aria-hidden="true"></i>
      </button>

      <ul class="opciones" *ngIf="!estaColapsada('categorias')">
        <li *ngFor="let cat of disponibles.categorias; let i = index" [style.--i]="i">
          <button
            type="button"
            class="opcion"
            [class.activo]="seleccion.id_categoria === cat.id_categoria"
            [attr.aria-pressed]="seleccion.id_categoria === cat.id_categoria"
            (click)="elegirCategoria(cat.id_categoria)">
            <span class="marca-check" aria-hidden="true"><i class="bi bi-check-lg"></i></span>
            <span class="etiqueta">{{ cat.nombre }}</span>
            <span class="cantidad x-numero">{{ cat.total_productos }}</span>
          </button>
        </li>
      </ul>
    </section>

    <!-- Marcas -->
    <section class="bloque" *ngIf="disponibles.marcas.length > 0">
      <button type="button" class="titulo-bloque" (click)="alternar('marcas')" [attr.aria-expanded]="!estaColapsada('marcas')">
        <span class="titulo-bloque__texto"><span class="n x-numero" aria-hidden="true"></span>Marcas</span>
        <i class="bi bi-chevron-down" aria-hidden="true"></i>
      </button>

      <ul class="opciones" *ngIf="!estaColapsada('marcas')">
        <li *ngFor="let m of disponibles.marcas; let i = index" [style.--i]="i">
          <button
            type="button"
            class="opcion"
            [class.activo]="seleccion.id_marca === m.id_marca"
            [attr.aria-pressed]="seleccion.id_marca === m.id_marca"
            (click)="elegirMarca(m.id_marca)">
            <span class="marca-check" aria-hidden="true"><i class="bi bi-check-lg"></i></span>
            <span class="etiqueta">{{ m.nombre }}</span>
            <span class="cantidad x-numero">{{ m.total_productos }}</span>
          </button>
        </li>
      </ul>
    </section>

    <!-- Precio -->
    <section class="bloque">
      <button type="button" class="titulo-bloque" (click)="alternar('precio')" [attr.aria-expanded]="!estaColapsada('precio')">
        <span class="titulo-bloque__texto"><span class="n x-numero" aria-hidden="true"></span>Precio</span>
        <i class="bi bi-chevron-down" aria-hidden="true"></i>
      </button>

      <div class="rango" *ngIf="!estaColapsada('precio')">
        <label class="campo">
          <span class="campo__rotulo">Desde</span>
          <span class="campo__caja">
            <b aria-hidden="true">S/</b>
            <input type="number" min="0" inputmode="decimal" [(ngModel)]="seleccion.precio_min" (change)="cambiarPrecio()" placeholder="0" />
          </span>
        </label>
        <label class="campo">
          <span class="campo__rotulo">Hasta</span>
          <span class="campo__caja">
            <b aria-hidden="true">S/</b>
            <input type="number" min="0" inputmode="decimal" [(ngModel)]="seleccion.precio_max" (change)="cambiarPrecio()" [placeholder]="disponibles.precio_max" />
          </span>
        </label>

        <!-- Cinta métrica: el tramo coloreado es el rango elegido dentro del disponible -->
        <div class="riel" aria-hidden="true">
          <i class="riel__tramo" [class.libre]="!seleccion.precio_min && !seleccion.precio_max" [style.--a]="tramoPrecio.desde" [style.--w]="tramoPrecio.ancho"></i>
        </div>
        <div class="riel__extremos x-numero" aria-hidden="true" *ngIf="disponibles.precio_max > 0">
          <span>S/ {{ disponibles.precio_min }}</span>
          <span>S/ {{ disponibles.precio_max }}</span>
        </div>
      </div>
    </section>

    <!-- Disponibilidad -->
    <section class="bloque">
      <button type="button" class="titulo-bloque" (click)="alternar('estado')" [attr.aria-expanded]="!estaColapsada('estado')">
        <span class="titulo-bloque__texto"><span class="n x-numero" aria-hidden="true"></span>Disponibilidad</span>
        <i class="bi bi-chevron-down" aria-hidden="true"></i>
      </button>

      <div class="interruptores" *ngIf="!estaColapsada('estado')">
        <button type="button" class="interruptor" role="switch" [attr.aria-checked]="!!seleccion.solo_stock" [class.activo]="seleccion.solo_stock" (click)="alternarStock()">
          <span class="interruptor__texto"><i class="bi bi-box-seam" aria-hidden="true"></i>Solo con stock</span>
          <span class="pastilla" aria-hidden="true"></span>
        </button>
        <button type="button" class="interruptor" role="switch" [attr.aria-checked]="!!seleccion.solo_oferta" [class.activo]="seleccion.solo_oferta" (click)="alternarOferta()">
          <span class="interruptor__texto"><i class="bi bi-percent" aria-hidden="true"></i>Solo en oferta</span>
          <span class="pastilla" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <!-- Especificaciones -->
    <section class="bloque" *ngFor="let attr of disponibles.atributos">
      <button type="button" class="titulo-bloque" (click)="alternar(attr.nombre)" [attr.aria-expanded]="!estaColapsada(attr.nombre)">
        <span class="titulo-bloque__texto"><span class="n x-numero" aria-hidden="true"></span>{{ attr.nombre }}</span>
        <i class="bi bi-chevron-down" aria-hidden="true"></i>
      </button>

      <div class="chips" *ngIf="!estaColapsada(attr.nombre)">
        <button
          type="button"
          class="x-chip"
          *ngFor="let v of attr.valores; let i = index"
          [style.--i]="i"
          [class.is-activo]="atributoActivo(attr.nombre, v.valor)"
          [attr.aria-pressed]="atributoActivo(attr.nombre, v.valor)"
          (click)="elegirAtributo(attr.nombre, v.valor)">
          {{ v.valor }}
        </button>
      </div>
    </section>
  </div>
</aside>
